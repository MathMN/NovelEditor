<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Novel Web Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="writeIcon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="writeIconIOS.png">
</head>
<body>
    <div id="drop-overlay" class="hidden">
        <div class="overlay-content">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            <h2>Drop your .md file here</h2>
        </div>
    </div>

    <div class="container">
        <header class="header hidden" id="editor-header">
            <div class="file-info">
                <span id="file-name">filename.md</span>
                <button id="save-btn" class="btn-primary hidden">Save</button>
            </div>
            <div class="header-controls">
                <button id="global-copy-btn" class="btn-secondary header-btn" title="Copy All with Annotations">
                    <svg class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span class="btn-text">Copy All</span>
                </button>
                <button id="global-export-btn" class="btn-primary header-btn" title="Export All with Annotations">
                    <svg class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span class="btn-text">Export All</span>
                </button>
                <button id="undo-btn" class="btn-secondary header-btn mobile-only-btn" title="Undo">
                    <svg class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                </button>
                <button id="redo-btn" class="btn-secondary header-btn mobile-only-btn" title="Redo">
                    <svg class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
                </button>
                <div class="zoom-controls">
                    <button id="zoom-out" class="btn-secondary zoom-btn" title="Decrease Text Size">A-</button>
                    <button id="zoom-in" class="btn-secondary zoom-btn" title="Increase Text Size">A+</button>
                </div>
                <div class="theme-toggle" id="theme-toggle" title="Toggle Theme">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </div>
            </div>
        </header>

        <div id="welcome-screen" class="welcome-screen">
            <h1>Novel Editor</h1>
            <p>Uma experiência de escrita minimalista.</p>
            <p class="instruction">Arraste e solte um arquivo <strong>.md</strong> em qualquer lugar para começar.</p>
            <button id="open-btn" class="btn-primary" style="margin-top: 1rem; padding: 0.75rem 2rem; font-size: 1.1rem; border-radius: 8px; font-weight: 500;">Selecionar Arquivo</button>
            <input type="file" id="file-input" class="hidden" accept=".md">
            <button id="restore-btn" class="btn-secondary hidden" style="margin-top: 1.5rem;">Restaurar Backup Não Salvo</button>
        </div>

        <div class="editor-wrapper">
            <div class="manuscript-container">
                <div id="gutter" class="hidden"></div>
                <div id="editor" class="hidden" contenteditable="true" spellcheck="false" data-placeholder="Comece a escrever..."></div>
            </div>
        </div>
    </div>

    <!-- Note UIs -->
    <button id="add-note-float-btn" class="hidden float-btn" title="Adicionar Nota">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        <span>Nota</span>
    </button>

    <div id="note-popup" class="hidden popup-ui">
        <textarea id="note-input" placeholder="Escreva sua nota (ex: Reescrever isso)..."></textarea>
        <div class="popup-actions">
            <button id="note-save-btn" class="btn-primary">Salvar</button>
            <button id="note-delete-btn" class="btn-secondary danger hidden">Excluir</button>
            <button id="note-cancel-btn" class="btn-secondary">Cancelar</button>
        </div>
    </div>

    <div id="note-hover-tooltip" class="hidden tooltip-ui"></div>

    <script src="main.js"></script>
</body>
</html>
